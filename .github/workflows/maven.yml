name: Java CI

on:
  workflow_dispatch:

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          distribution: zulu
          expander_leg: macos-latest--arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v1
    - name: Set up JDK 1.8
      uses: actions/setup-java@v4
      with:
        distribution: ${{ matrix.distribution }}
        java-version: '8'
        architecture: ${{ matrix.arch }}
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
